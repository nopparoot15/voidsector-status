<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07070f">
<title>VoidSector — ปิดปรับปรุง</title>
<style>
  :root{--bg:#07070f;--card:#12121f;--line:rgba(255,255,255,.09);--text:#eceefb;--sub:#9a9fc0;--pri:#7c6cff;--ok:#3ddc97}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;min-height:100dvh;background:radial-gradient(1100px 560px at 50% -12%,#1c1745 0%,var(--bg) 62%);color:var(--text);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
  main{width:min(480px,100%);text-align:center}
  .logo{font-weight:800;letter-spacing:.18em;font-size:13px;color:var(--sub);margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:36px 26px 28px}
  .orb{width:68px;height:68px;margin:0 auto 22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c3b9ff,var(--pri) 55%,#2a2370);animation:pulse 2.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,108,255,.45)}70%{box-shadow:0 0 0 28px rgba(124,108,255,0)}100%{box-shadow:0 0 0 0 rgba(124,108,255,0)}}
  h1{font-size:26px;line-height:1.3;margin:0 0 8px;font-weight:800}
  p{margin:0;color:var(--sub);font-size:15px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);text-decoration:none;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .btn:hover{background:rgba(255,255,255,.08)}
  .btn.pri{background:var(--pri);border-color:transparent;color:#fff}
  .btn.pri:hover{filter:brightness(1.08)}
  .st{margin-top:22px;font-size:13px;color:var(--sub);display:flex;gap:8px;align-items:center;justify-content:center;min-height:20px}
  .dot{width:8px;height:8px;border-radius:50%;background:#f5b84a;flex:none}
  .st.ok .dot{background:var(--ok)}
  footer{margin-top:18px;font-size:12px;color:#6d7295}
  @media (prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body>
<main>
  <div class="logo">VOIDSECTOR</div>
  <div class="card">
    <div class="orb" aria-hidden="true"></div>
    <h1>ปิดปรับปรุง</h1>
    <p>ตอนนี้เว็บกำลังปิดปรับปรุงชั่วคราว<br>ลองใหม่ภายหลัง แล้วเราจะกลับมาเร็วๆ นี้</p>
    <div class="st" id="stWrap" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="st">กำลังตรวจสอบสถานะ…</span></div>
    <div class="row">
      <a class="btn pri" href="https://voidsector.net/" id="retry">ลองเข้าเว็บอีกครั้ง</a>
      <a class="btn" href="https://discord.com/users/salty6ix" target="_blank" rel="noopener">ติดต่อผู้ดูแล</a>
    </div>
  </div>
  <footer>หน้านี้แสดงเมื่อเซิร์ฟเวอร์ปิดให้บริการเท่านั้น</footer>
</main>
<script>
  // Shown by the Cloudflare Worker (worker/worker.js) in place of voidsector.net while the server is off. The Worker also answers
  // /__ping on voidsector.net: 200 = the real site is back, 503 = still down. Every 30 s this page asks and reloads into the site.
  var onSite = /(^|\.)voidsector\.net$/.test(location.hostname) && location.hostname !== 'status.voidsector.net';
  var st = document.getElementById('st'), wrap = document.getElementById('stWrap'), n = 0;
  if (!onSite) { st.textContent = 'ปิดปรับปรุงอยู่ในขณะนี้'; }
  else {
    var tick = function () {
      n++;
      fetch('/__ping?' + Date.now(), { cache: 'no-store' }).then(function (r) {
        if (r.status === 200) { wrap.className = 'st ok'; st.textContent = 'กลับมาแล้ว กำลังพาเข้าเว็บ…'; location.reload(); }
        else st.textContent = 'ยังปิดปรับปรุงอยู่ · ตรวจสอบครั้งที่ ' + n;
      }).catch(function () { st.textContent = 'ยังปิดปรับปรุงอยู่ · ตรวจสอบครั้งที่ ' + n; });
    };
    setTimeout(tick, 5000); setInterval(tick, 30000);
  }
</script>
</body>
</html>
